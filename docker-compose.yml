services:
  mysql:
    image: mysql:8.4
    container_name: uniform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uniform_db
      MYSQL_USER: uniform
      MYSQL_PASSWORD: uniform
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - uniform_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "uniform", "-puniform"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  uniform_mysql_data:
