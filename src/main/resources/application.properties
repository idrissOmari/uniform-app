# Application Configuration — uniform-app
quarkus.application.name=uniform-app
quarkus.http.port=8080

# MySQL 8.4 LTS Datasource
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:uniform}
quarkus.datasource.password=${DB_PASSWORD:uniform}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/uniform_db?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}

# Hibernate ORM & Flyway Schema Validation
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# SmallRye JWT
mp.jwt.verify.issuer=https://uniform-app.local/issuer
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
